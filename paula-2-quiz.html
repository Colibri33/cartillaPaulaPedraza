<style>

  :root{--ink:#2b1240;--pink:#e23e7a;--orange:#f28c28;--lav:#f4eefa;--line:#e3d8ee;--muted:#6e5a80;

  .shot.miss{background:var(--lav);border-color:var(--bad);color:var(--bad)}
  .card{border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}

  .opts{display:flex;flex-direction:column;gap:8px}

  .opts.tf .opt{flex:1;justify-content:center;font-weight:700;font-size:16px}
  .opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px;transition:.15s}
  .opt:hover:not([disabled]){border-color:var(--pink)}
  .opt[disabled]{cursor:default}
  .opt.good{background:var(--good-bg);border-color:var(--good)}
  .opt.bad{background:var(--bad-bg);border-color:var(--bad)}
  .opt.dim{opacity:.45}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hint{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border:1.5px dashed var(--line);border-radius:999px;padding:5px 12px}
  .hint[disabled]{cursor:default;opacity:.6}
  .hinttxt{background:var(--lav);border-radius:8px;padding:8px 12px;font-size:14px}
  .fb{border-radius:8px;padding:10px 13px;border-left:5px solid}
  .fb.good{background:var(--good-bg);border-color:var(--good)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
  .fb strong{display:block}
  .btn{all:unset;cursor:pointer;background:var(--pink);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px}
  .btn.alt{background:var(--ink)}
  .opt:focus-visible,.btn:focus-visible,.hint:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .big{font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:60px;font-weight:700;line-height:1}
  .res{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  [hidden]{display:none!important}

  .mrow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
  .mascot{width:96px;height:118px;display:flex;align-items:flex-end;justify-content:center}
  .mascot svg{width:100%;height:100%;animation:hop 1.8s ease-in-out infinite;transform-origin:50% 100%}
  .mascot.bump svg{animation:bump .6s ease-out,hop 1.8s ease-in-out .6s infinite}
  .wave{transform-box:fill-box;transform-origin:0% 100%;animation:wv .8s ease-in-out infinite alternate}
  .speech{position:relative;background:#fff;border:2.5px solid #2b1240;border-radius:16px;padding:10px 14px;font-weight:700;min-height:44px;display:flex;align-items:center}
  .speech:before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#2b1240;border-left:0}
  .speech b.nm{color:#e23e7a;margin-right:6px}
  .cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall linear forwards}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
  @keyframes wv{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){.mascot svg,.wave,.cf{animation:none!important}}
  @media (max-width:600px){.mrow{grid-template-columns:72px 1fr}.mascot{width:72px;height:90px}}

<script>
const Q=[

const MEDAL=t=>{const c={oro:["#f2c14e","#b8860b"],plata:["#d5dbe3","#8a96a6"],bronce:["#d9915a","#9a5a2a"]}[t];return `<svg width="74" height="96" viewBox="0 0 74 96" aria-label="Medalla de ${t}" style="flex:none;animation:bump .7s ease-out"><path d="M18 0h14l9 34H27z" fill="#0081c8"/><path d="M56 0H42l-9 34h14z" fill="#ee334e"/><circle cx="37" cy="62" r="28" fill="${c[0]}" stroke="${c[1]}" stroke-width="5"/><circle cx="37" cy="62" r="18" fill="none" stroke="${c[1]}" stroke-width="2" stroke-dasharray="3 3"/><text x="37" y="68" text-anchor="middle" font-family="Arial" font-weight="900" font-size="16" fill="${c[1]}">${t==="oro"?"1":t==="plata"?"2":"3"}</text></svg>`};let i=0, score=0, res=[], usedHint=false;
const $=id=>document.getElementById(id);
function shots(){ $("shots").innerHTML=Q.map((_,k)=>`<span class="shot ${k===i?"cur":""} ${res[k]===1?"hit":res[k]===.5?"half":res[k]===0?"miss":""}">${k+1}</span>`).join(""); }
function show(){
  shots(); const c=$("card");
  if(i>=Q.length){
    const nota=(score/Q.length*10).toFixed(1);const md=nota>=8?"oro":nota>=6?"plata":"bronce";FUN.say(nota>=6?"good":"mid",nota>=8?"¡Oro! Lo hiciste increíble.":nota>=6?"¡Plata! Muy bien.":"Bronce. ¡Repasa y vuelve a intentarlo!");if(nota>=6)FUN.confetti(100);

    c.innerHTML=`<div class="res">${MEDAL(md)}<span class="big">${nota}</span><div><b style="font-size:18px">${msg}</b><p class="sub">Nota sobre 10 · ${res.filter(r=>r===1).length} aciertos limpios · ${res.filter(r=>r===.5).length} con pista</p></div></div>
      <button class="btn alt" id="again" style="align-self:flex-start">Repetir el quiz</button>`;
    $("again").onclick=()=>{i=0;score=0;res=[];show()}; return;
  }
  usedHint=false; const q=Q[i]; const opts=q.t==="vf"?["Verdadero","Falso"]:q.o;
  c.innerHTML=`<span class="type">${q.t==="vf"?"Verdadero o falso":"Selección múltiple"} · Pregunta ${i+1} de ${Q.length}</span>

    <div class="opts ${q.t==="vf"?"tf":""}">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>
    <div class="row"><button class="hint" id="hint">💡 Pedir pista (vale ½)</button></div><div id="ht"></div><div id="fb"></div>`;
  $("hint").onclick=()=>{FUN.say("mid","Aquí va una ayudita…");usedHint=true;$("hint").setAttribute("disabled","");$("ht").innerHTML=`<div class="hinttxt">${q.h}</div>`};
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j, ok=j===q.a, val=ok?(usedHint?.5:1):0; score+=val; res[i]=val;
    c.querySelectorAll(".opt").forEach((x,k)=>{x.setAttribute("disabled","");if(k===q.a)x.classList.add("good");else if(k!==j)x.classList.add("dim")});
    if(!ok)b.classList.add("bad"); $("hint").setAttribute("disabled",""); shots();FUN.say(ok?"good":"bad",FUN.pick(ok?GOOD:BAD));if(ok)FUN.confetti(30);
    $("fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><strong>${ok?(usedHint?"¡Correcto, con pista! +½":"¡Correcto! +1"):"Incorrecto"}</strong>${q.e}</div>
      <button class="btn" id="next" style="margin-top:10px">${i+1<Q.length?"Siguiente pregunta →":"Ver mi nota"}</button>`;
    $("next").onclick=()=>{i++;show()};
  });
}
show();
</script>
</body></html>
