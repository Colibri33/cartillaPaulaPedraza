<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autodiagnóstico de habilidades</title>
<!-- WIDGET 4 · AUTODIAGNÓSTICO DE HABILIDADES BLANDAS (Módulo 3) — Cartilla Olimpismo -->
<style>
  :root{--navy:#14213d;--red:#c8394d;--teal:#16708a;--teal-bg:#e0f0f4;--soft:#eef2f7;--line:#dce1e9;--muted:#586379;
    --good:#1d7f46;--good-bg:#e2f4e9;--mid:#a86400;--mid-bg:#fff1d8;--bad:#b3261e;--bad-bg:#fde4e2}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--navy);font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.4}
  .wrap{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:900px;margin:auto}
  h1{font-family:Arial,sans-serif;font-size:21px;margin:0}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
  .tab{all:unset;cursor:pointer;padding:8px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab[aria-selected="true"]{color:var(--navy);border-color:var(--red)}
  .tab:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--teal)}
  .legend{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:6px;padding:6px 10px}
  .it{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .sc{display:flex;gap:4px}
  .sc label{position:relative;width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;font-weight:700}
  .sc input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .sc label:has(input:checked){background:var(--teal);border-color:var(--teal);color:#fff}
  .sc label:has(input:focus-visible){outline:3px solid var(--teal);outline-offset:2px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{all:unset;cursor:pointer;background:var(--red);color:#fff;font-weight:700;border-radius:8px;padding:10px 16px}
  .btn.alt{background:var(--navy)}
  .warn{color:var(--bad);font-size:13.5px}
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center}
  .track{height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
  .fill{height:100%;border-radius:7px;background:var(--teal);width:0;transition:width .7s}
  .bar.top .fill{background:var(--good)}.bar.low .fill{background:var(--red)}
  .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .tip{background:var(--teal-bg);border-left:5px solid var(--teal);border-radius:8px;padding:11px 14px}
  .panel{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .q{font-family:Arial,sans-serif;font-size:18px;font-weight:700;margin:0}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:8px;padding:10px 13px}
  .opt:hover:not([disabled]){border-color:var(--navy)}
  .opt[disabled]{cursor:default;opacity:.55}
  .good{background:var(--good-bg);border-color:var(--good)!important;opacity:1!important}
  .mid{background:var(--mid-bg);border-color:var(--mid)!important;opacity:1!important}
  .bad{background:var(--bad-bg);border-color:var(--bad)!important;opacity:1!important}
  .fb{border-radius:8px;padding:10px 13px;border-left:5px solid}
  .fb strong{display:block}
  [hidden]{display:none!important}
  @media (max-width:600px){.it{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 38px}.wrap{padding:12px}}
</style></head><body>
<div class="wrap">
  <div><h1>Autodiagnóstico de habilidades blandas</h1><p class="sub">Responde con sinceridad: no hay respuestas buenas ni malas.</p></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-t="test">1. Test</button>
    <button class="tab" role="tab" aria-selected="false" data-t="esc">2. Escenarios</button>
  </div>

  <section id="test">
    <p class="legend">1 = Nunca · 2 = A veces · 3 = Casi siempre · 4 = Siempre</p>
    <div id="items"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="go">Ver mi perfil</button><span class="warn" id="warn"></span></div>
    <div id="out" style="margin-top:14px" hidden>
      <div class="bars" id="bars"></div>
      <div class="tip" id="tip" style="margin-top:12px"></div>
    </div>
  </section>

  <section id="esc" hidden></section>
</div>
<script>
const TEST=[
 ["Liderazgo","Cuando el grupo duda, propongo un rumbo claro."],["Liderazgo","Asumo la responsabilidad cuando algo sale mal."],
 ["Comunicación","Doy instrucciones breves y fáciles de entender."],["Comunicación","Escucho sin interrumpir antes de responder."],
 ["Trabajo en equipo","Pongo el objetivo del grupo por encima de mi lucimiento."],["Trabajo en equipo","Colaboro con personas que no son de mi agrado."],
 ["Inteligencia emocional","Me doy cuenta cuando el enojo afecta mis decisiones."],["Inteligencia emocional","Percibo cómo se sienten los demás aunque no lo digan."],
 ["Resolución de problemas","Ante un imprevisto busco al menos dos alternativas."],["Resolución de problemas","Evalúo si mi solución funcionó y la ajusto."]
];
const TIPS={
 "Liderazgo":"Esta semana, ofrécete a dirigir el calentamiento o una actividad del grupo.",
 "Comunicación":"Practica dar una instrucción en menos de 15 segundos y pide que te la repitan.",
 "Trabajo en equipo":"En tu próxima práctica, trabaja con alguien con quien casi nunca haces pareja.",
 "Inteligencia emocional":"Antes de responder en un momento tenso, respira y cuenta hasta 5.",
 "Resolución de problemas":"Ante el próximo imprevisto, escribe dos soluciones antes de elegir una."
};
const ESC=[
 {p:"En un torneo juvenil, un padre grita al árbitro desde la grada y su hijo empieza a imitarlo. ¿Qué haces como entrenador?",o:[
  ["Calmo al jugador y luego hablo con el padre en privado.","good","Inteligencia emocional + comunicación: corriges sin exponer a nadie en público."],
  ["Ignoro la situación para concentrarme en el partido.","mid","Proteges el foco, pero dejas pasar una conducta que va contra el respeto."],
  ["Le grito al padre que se calle.","bad","Repites la conducta que quieres corregir."]]},
 {p:"Faltan 10 minutos para tu sesión y la cancha está ocupada por otro grupo. ¿Qué haces?",o:[
  ["Adapto la sesión a un espacio reducido con ejercicios técnicos.","good","Resolución de problemas: mantienes el objetivo y cambias el medio."],
  ["Discuto con el otro entrenador por el espacio.","mid","Quizás recuperes la cancha, pero dañas la relación."],
  ["Cancelo la sesión.","bad","Pierdes la sesión sin buscar alternativas."]]}
];
const $=id=>document.getElementById(id);
let ans={}; try{ans=JSON.parse(localStorage.getItem("cartilla-test")||"{}")}catch(e){}

$("items").innerHTML=TEST.map((q,i)=>`<div class="it"><span>${i+1}. ${q[1]}</span><div class="sc" role="radiogroup" aria-label="Ítem ${i+1}">${[1,2,3,4].map(n=>`<label>${n}<input type="radio" name="q${i}" value="${n}" ${ans[i]==n?"checked":""}></label>`).join("")}</div></div>`).join("");
document.querySelectorAll("#items input").forEach(r=>r.onchange=()=>{ans[r.name.slice(1)]=+r.value;try{localStorage.setItem("cartilla-test",JSON.stringify(ans))}catch(e){}});

$("go").onclick=()=>{
  const miss=TEST.findIndex((_,i)=>!ans[i]);
  if(miss>=0){$("warn").textContent=`Te falta responder la afirmación ${miss+1}.`;return}
  $("warn").textContent="";
  const sc={}; TEST.forEach((q,i)=>sc[q[0]]=(sc[q[0]]||0)+ans[i]);
  const list=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const max=list[0][1], min=list[list.length-1][1];
  $("bars").innerHTML=list.map(([k,v])=>`<div class="bar ${v===max?"top":v===min?"low":""}"><span>${k}</span><div class="track"><div class="fill" data-w="${v/8*100}"></div></div><span class="n">${v}/8</span></div>`).join("");
  const low=list[list.length-1][0];
  $("tip").innerHTML=`<b>Tu fortaleza:</b> ${list[0][0]}.<br><b>Por desarrollar:</b> ${low}.<br><b>Reto de la semana:</b> ${TIPS[low]}`;
  $("out").hidden=false;
  requestAnimationFrame(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"));
};

$("esc").innerHTML=ESC.map((e,i)=>`<div class="panel" data-i="${i}" style="margin-bottom:12px"><span class="sub">Escenario ${i+1}</span><p class="q">${e.p}</p><div class="opts">${e.o.map((o,j)=>`<button class="opt" data-j="${j}">${o[0]}</button>`).join("")}</div><div class="slot"></div></div>`).join("");
document.querySelectorAll("#esc .panel").forEach(p=>{
  const e=ESC[+p.dataset.i];
  p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=e.o[+b.dataset.j]; p.querySelectorAll(".opt").forEach(x=>x.setAttribute("disabled",""));
    b.classList.add(o[1]);
    const lab={good:"Buena decisión",mid:"Decisión parcial",bad:"Decisión a revisar"}[o[1]];
    p.querySelector(".slot").innerHTML=`<div class="fb ${o[1]}"><strong>${lab}</strong>${o[2]}</div><button class="btn alt" style="margin-top:8px">Intentar de nuevo</button>`;
    p.querySelector(".slot button").onclick=()=>{p.querySelectorAll(".opt").forEach(x=>{x.removeAttribute("disabled");x.className="opt"});p.querySelector(".slot").innerHTML=""};
  });
});

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  $("test").hidden=t.dataset.t!=="test"; $("esc").hidden=t.dataset.t!=="esc";
});
</script>
</body></html>
