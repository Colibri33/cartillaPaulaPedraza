<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz final</title>
<!-- WIDGET 2 · QUIZ FINAL (Módulo 8) — Cartilla Olimpismo -->
<style>
  :root{--navy:#14213d;--red:#c8394d;--teal:#16708a;--soft:#eef2f7;--line:#dce1e9;--muted:#586379;
    --good:#1d7f46;--good-bg:#e2f4e9;--bad:#b3261e;--bad-bg:#fde4e2;--yellow:#e09b12}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--navy);font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45}
  .wrap{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:900px;margin:auto}
  h1{font-family:Arial,sans-serif;font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--red);transition:width .4s}
  .card{border:1.5px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .q{font-family:Arial,sans-serif;font-size:19px;font-weight:700;margin:0}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;display:flex;gap:10px;align-items:center;transition:.15s}
  .opt:hover:not([disabled]){border-color:var(--navy)}
  .opt:focus-visible,.btn:focus-visible{outline:3px solid var(--teal)}
  .opt[disabled]{cursor:default}
  .opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.good{background:var(--good-bg);border-color:var(--good)}.opt.good .l{background:var(--good);color:#fff}
  .opt.bad{background:var(--bad-bg);border-color:var(--bad)}.opt.bad .l{background:var(--bad);color:#fff}
  .opt.dim{opacity:.5}
  .fb{border-radius:8px;padding:11px 14px;border-left:5px solid}
  .fb.good{background:var(--good-bg);border-color:var(--good)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
  .fb strong{display:block;margin-bottom:2px}
  .btn{all:unset;cursor:pointer;background:var(--red);color:#fff;font-weight:700;border-radius:8px;padding:10px 16px;align-self:flex-start}
  .btn.alt{background:var(--navy)}
  .score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .num{font-family:Arial,sans-serif;font-size:56px;font-weight:800;line-height:1}
  .rev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
  .rev li{display:flex;gap:8px}
  .ok{color:var(--good);font-weight:700}.ko{color:var(--bad);font-weight:700}
  @media (max-width:600px){.wrap{padding:12px}.num{font-size:44px}}
</style></head><body>
<div class="wrap">
  <div><h1>Quiz final</h1><p class="sub">8 preguntas sobre valores olímpicos y habilidades blandas. Recibirás retroalimentación en cada una.</p></div>
  <div class="top"><span id="cnt"></span><span id="hits"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card"></div>
</div>
<script>
const QUIZ=[
 ["¿Cuáles son los tres valores olímpicos según el COI?",["Fuerza, velocidad y resistencia","Excelencia, respeto y amistad","Disciplina, éxito y honor","Paz, unión y deporte"],1,"El Comité Olímpico Internacional resume el Olimpismo en excelencia, respeto y amistad."],
 ["La excelencia olímpica significa principalmente…",["Ganar medallas","Superar siempre al rival","Dar lo mejor de uno mismo y progresar","Entrenar más horas que nadie"],2,"La excelencia se centra en el progreso personal, no solo en el resultado."],
 ["Un gestor que respeta el criterio médico pese a la presión por ganar demuestra…",["Amistad","Respeto","Excelencia técnica","Trabajo en equipo"],1,"Es respeto por la salud y la integridad del deportista."],
 ["¿Qué habilidad blanda permite controlar la frustración ante una mala decisión arbitral?",["Liderazgo","Trabajo en equipo","Inteligencia emocional","Resolución de problemas"],2,"Reconocer y regular las propias emociones es inteligencia emocional."],
 ["Adaptar la sesión cuando la cancha no está disponible es un ejemplo de…",["Resolución de problemas","Amistad","Respeto","Liderazgo autoritario"],0,"Mantienes el objetivo y cambias el medio: resolución de problemas."],
 ["La retroalimentación “sándwich” (positivo – mejora – positivo) es una técnica de…",["Nutrición deportiva","Comunicación","Planificación de cargas","Arbitraje"],1,"Es una técnica de comunicación para corregir sin desmotivar."],
 ["¿Qué acción refleja mejor el valor de la amistad?",["Celebrar frente al rival","Compartir la cancha con un club rival afectado por una inundación","Exigir sanciones al rival","Entrenar en secreto"],1,"La amistad construye puentes con otros, incluso con el rival."],
 ["Ante estudiantes que no participan en clase, la primera acción más formativa es…",["Sancionarlos frente a todos","Escuchar sus motivos","Ignorarlos","Enviarlos a dirección"],1,"Comprender antes de corregir favorece el compromiso."]
];
const L="ABCD"; let i=0, sc=0, log=[];
const $=id=>document.getElementById(id);
function head(){ $("cnt").textContent=i<QUIZ.length?`Pregunta ${i+1} de ${QUIZ.length}`:"Resultado";
  $("hits").textContent=`Aciertos: ${sc}`; $("bar").style.width=(Math.min(i,QUIZ.length)/QUIZ.length*100)+"%"; }
function show(){
  head(); const c=$("card");
  if(i>=QUIZ.length){
    const nota=(sc/QUIZ.length*10).toFixed(1);
    const msg=sc>=7?"¡Dominas el tema!":sc>=5?"Aprobado. Repasa las preguntas que fallaste.":"Repasa los módulos 2, 3 y 4 y vuelve a intentarlo.";
    try{localStorage.setItem("cartilla-quiz",JSON.stringify({sc,nota}))}catch(e){}
    c.innerHTML=`<div class="score"><span class="num">${nota}</span><div><b>${msg}</b><br><span class="sub">${sc} de ${QUIZ.length} correctas · Nota sobre 10</span></div></div>
      <ul class="rev">${QUIZ.map((q,k)=>`<li><span class="${log[k]?"ok":"ko"}">${log[k]?"✔":"✘"}</span><span>${q[0]}</span></li>`).join("")}</ul>
      <button class="btn alt" id="again">Repetir quiz</button>`;
    $("again").onclick=()=>{i=0;sc=0;log=[];show()}; return;
  }
  const q=QUIZ[i];
  c.innerHTML=`<p class="q">${q[0]}</p><div class="opts">${q[1].map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${L[j]}</span><span>${o}</span></button>`).join("")}</div><div id="fb"></div>`;
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j, ok=j===q[2]; if(ok)sc++; log[i]=ok;
    c.querySelectorAll(".opt").forEach((x,k)=>{x.setAttribute("disabled","");if(k===q[2])x.classList.add("good");else if(k!==j)x.classList.add("dim")});
    if(!ok)b.classList.add("bad"); head();
    $("fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><strong>${ok?"¡Correcto!":"Incorrecto"}</strong>${q[3]}</div>
      <button class="btn" id="next" style="margin-top:10px">${i+1<QUIZ.length?"Siguiente →":"Ver mi nota"}</button>`;
    $("next").onclick=()=>{i++;show()};
  });
}
show();
</script>
</body></html>
