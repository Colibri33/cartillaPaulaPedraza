<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflexión</title>
<!-- WIDGET P5 · REFLEXIÓN (Módulos 1, 7 y 8) — Cartilla de Paula Andrea Pedraza Núñez
     ?m=1 -> Mi ficha de profesional (pregunta detonante)
     ?m=7 -> Diseña tu sesión + caso real + foro
     ?m=8 -> Autoevaluación con estrellas + compromiso final -->
<style>
  @font-face{font-family:"Matcha Style";src:local("Matcha Style"),url("MatchaStyle.ttf") format("truetype"),url("MatchaStyle.otf") format("opentype");font-display:swap}
  @font-face{font-family:"Creato Display";font-weight:400;src:local("Creato Display"),local("CreatoDisplay-Regular"),url("CreatoDisplay-Regular.otf") format("opentype"),url("CreatoDisplay-Regular.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"Creato Display";font-weight:700;src:local("Creato Display Bold"),local("CreatoDisplay-Bold"),url("CreatoDisplay-Bold.otf") format("opentype"),url("CreatoDisplay-Bold.ttf") format("truetype");font-display:swap}
  :root{--ink:#2b1240;--pink:#e23e7a;--orange:#f28c28;--lav:#f4eefa;--line:#e3d8ee;--muted:#6e5a80;--good:#1f8a5b}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:"Creato Display","Segoe UI",Tahoma,Verdana,sans-serif;font-size:14.5px;line-height:1.45}
  .wrap{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:920px;margin:auto}
  h1{font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:26px;font-weight:400;margin:0}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  label.lbl,span.lbl{display:block;font-weight:700;margin-bottom:4px}
  textarea,input[type=text],select{width:100%;font:inherit;color:inherit;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
  textarea{min-height:86px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px #f9d3e2}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
  .ok{color:var(--good)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px}
  .chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;border-radius:999px;padding:7px 14px;background:var(--lav);font-weight:700;font-size:13.5px}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}
  .btn{all:unset;cursor:pointer;background:var(--pink);color:#fff;font-weight:700;border-radius:999px;padding:9px 18px}
  .btn.alt{background:var(--ink)}
  .chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.star:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .case{background:var(--lav);border-radius:10px;padding:12px 14px}
  .note{font-size:12.5px;color:var(--muted);background:var(--lav);border-radius:8px;padding:8px 10px}
  /* ficha */
  .fcard{background:var(--ink);color:#fff;border-radius:16px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;max-width:560px}
  .num{width:84px;height:84px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:34px;font-weight:700;color:var(--ink)}
  .fcard .role{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
  .fcard h2{margin:2px 0 6px;font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:22px}
  .fcard .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
  .fcard .tags span{background:var(--pink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
  .fcard p{margin:0;font-size:13.5px;opacity:.9;font-style:italic}
  /* estrellas */
  .crit{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
  .stars{display:flex;gap:2px}
  .star{all:unset;cursor:pointer;font-size:24px;line-height:1;color:var(--line)}
  .star.on{color:var(--orange)}
  .badge{background:var(--ink);color:#fff;border-radius:16px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
  .badge h2{margin:0;font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;text-transform:uppercase;font-size:22px}
  .badge .q{font-style:italic;opacity:.9;max-width:520px}
  .out{white-space:pre-wrap;background:var(--lav);border-radius:8px;padding:10px;font-size:13.5px}
  [hidden]{display:none!important}
  @media (max-width:640px){.g2{grid-template-columns:1fr}.fcard{grid-template-columns:1fr;text-align:center;justify-items:center}.wrap{padding:12px}}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const m=new URLSearchParams(location.search).get("m")||"1";
const KEY="paula-reflex-"+m; let S={}; try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const ta=(id,l,ph,min=20)=>`<div class="full"><label class="lbl" for="${id}">${l}</label><textarea id="${id}" data-min="${min}" placeholder="${ph}">${esc(S[id])}</textarea><div class="meta"><span class="ok" id="ok_${id}"></span><span id="c_${id}"></span></div></div>`;
const tx=(id,l,ph)=>`<div><label class="lbl" for="${id}">${l}</label><input type="text" id="${id}" placeholder="${ph}" value="${esc(S[id])}"></div>`;
const sl=(id,l,opts)=>`<div><label class="lbl" for="${id}">${l}</label><select id="${id}">${["",...opts].map(o=>`<option ${S[id]===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
const chips=(k,list,max)=>`<div class="chips" data-chips="${k}" data-max="${max}">${list.map(w=>`<button class="chip" aria-pressed="${(S[k]||[]).includes(w)}">${w}</button>`).join("")}</div>`;
const VAL=["Excelencia","Respeto","Amistad"], HAB=["Liderazgo","Comunicación","Trabajo en equipo","Inteligencia emocional","Resolución de problemas"];

const V={
"1":`<div><h1>Mi ficha de profesional</h1><p class="sub">Responde la pregunta detonante y arma tu ficha profesional.</p></div>
 <div class="g2">${tx("nombre","Tu nombre","Ej.: Paula")}${sl("rol","¿Qué rol te gustaría tener?",["Entrenadora","Docente de Educación Física","Gestora deportiva","Preparadora física","Psicóloga deportiva","Árbitra"])}
 ${tx("dorsal","Tu número de camiseta favorito","Ej.: 7")}
 <div><span class="lbl">Elige 3 cualidades que te definan</span>${chips("cual",["Disciplinada","Empática","Creativa","Justa","Motivadora","Paciente","Estratégica","Inclusiva","Valiente"],3)}</div>
 ${ta("r1","¿Qué tipo de profesional del deporte quiero ser?","Quiero ser una profesional que…")}</div>
 <div class="row"><button class="btn" id="mk">Generar mi ficha</button><span class="sub" id="w"></span></div><div id="card"></div>`,
"7":`<div><h1>Actividades prácticas</h1><p class="sub">Completa las tres pestañas. Todo se guarda en este navegador.</p></div>
 <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-t="t1">1. Diseña tu sesión</button><button class="tab" role="tab" aria-selected="false" data-t="t2">2. Caso real</button><button class="tab" role="tab" aria-selected="false" data-t="t3">3. Foro y evidencias</button></div>
 <section id="t1"><div class="g2">${tx("grupo","Grupo","Ej.: voleibol femenino sub-14, 12 deportistas")}${tx("obj","Objetivo técnico-táctico","Ej.: mejorar el saque y la recepción")}
  ${sl("val","Valor olímpico",VAL)}${sl("hab","Habilidad blanda",HAB)}
  ${ta("fase1","Fase inicial (10–15 min)","Ej.: calentamiento en parejas; cada pareja se felicita al lograr 10 toques seguidos",10)}
  ${ta("fase2","Fase central (30–40 min)","Ej.: juego reducido donde el punto vale doble si todas tocaron el balón",10)}
  ${ta("fase3","Fase final y reflexión (10 min)","Ej.: círculo: ¿en qué momento vimos respeto hoy?",10)}</div>
  <div class="row" style="margin-top:8px"><button class="btn" id="ficha">Generar ficha de sesión</button><button class="btn alt" data-copy="ses">Copiar ficha</button><span class="sub" id="cm_ses"></span></div><div class="out" id="fout" hidden></div></section>
 <section id="t2" hidden><div class="case"><b>Softball universitario, Estados Unidos (2008).</b> Sara Tucholsky, de Western Oregon, conectó el primer jonrón de su carrera, pero se lesionó la rodilla al pasar por primera base y no podía correr. Las reglas no permitían que sus compañeras la ayudaran. Entonces Mallory Holtman y Liz Wallace, jugadoras del equipo rival (Central Washington), la cargaron alrededor de las bases para que su jonrón contara. Su equipo terminó perdiendo ese partido.</div>
  <div class="g2" style="margin-top:10px">${ta("c1","1. ¿Qué valor o valores olímpicos identificas? ¿Por qué?","Identifico…")}${ta("c2","2. ¿Qué habilidades blandas demostraron Holtman y Wallace?","Demostraron…")}${ta("c3","3. Como profesional del deporte, ¿cómo usarías este caso con tus deportistas?","Lo usaría…")}</div></section>
 <section id="t3" hidden><div class="g2">${ta("foro","Foro: ¿Qué fue lo más difícil de integrar un valor olímpico en tu sesión? ¿Cómo lo resolviste?","Lo más difícil fue…")}
  <div class="full"><label class="lbl" for="ev">Evidencia de tu sesión (foto, video o PDF)</label><input type="file" id="ev" multiple accept="image/*,video/*,.pdf"><p class="note" id="evl">La entrega oficial se hace en el aula virtual del curso. Aquí puedes revisar qué archivos vas a subir.</p></div></div>
  <div class="row" style="margin-top:8px"><button class="btn alt" data-copy="all">Copiar todas mis respuestas</button><span class="sub" id="cm_all"></span></div></section>`,
"8":`<div><h1>Autoevaluación y cierre</h1><p class="sub">Califícate de 1 a 5 estrellas en cada criterio y escribe tu compromiso final.</p></div>
 <div id="crit"></div><p style="margin:4px 0 0"><b>Total: <span id="tot"></span> / 25 estrellas</b></p>
 <div class="g2">${ta("fin","¿Cómo voy a aplicar esto en mi práctica profesional? (qué haré, cuándo y con quién)","En mi próxima práctica con…",30)}
 ${ta("carta","Mensaje para mí misma dentro de un año, cuando ya esté trabajando en el deporte","Querida yo del futuro…",10)}</div>
 <div class="row"><button class="btn" id="close">Terminar la ruta</button><button class="btn alt" data-copy="all">Copiar mis respuestas</button><span class="sub" id="cm_all"></span></div><div id="badge"></div>`
};
const CRIT=["Comprendo y aplico los valores olímpicos","Reconozco mis habilidades blandas y cuáles debo entrenar","Tomo decisiones éticas en los casos","Integro valores en el diseño de una sesión","Reflexiono sobre mi futuro rol profesional"];
$("app").innerHTML=V[m]||V["1"];

/* guardado */
document.querySelectorAll("textarea").forEach(t=>{const up=()=>{const n=t.value.trim().length,mn=+t.dataset.min;$("c_"+t.id).textContent=n<mn?`Mínimo ${mn} caracteres (${n})`:`${n} caracteres ✔`};up();
  t.oninput=()=>{S[t.id]=t.value;save();$("ok_"+t.id).textContent="Guardado ✔";up()}});
document.querySelectorAll("input[type=text],select").forEach(x=>x.addEventListener(x.tagName==="SELECT"?"change":"input",()=>{S[x.id]=x.value;save()}));
document.querySelectorAll("[data-chips]").forEach(box=>box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const k=box.dataset.chips,mx=+box.dataset.max;let a=S[k]||[];const w=c.textContent;
  if(a.includes(w))a=a.filter(x=>x!==w);else if(a.length<mx)a.push(w);else return;S[k]=a;save();box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",a.includes(x.textContent)))}));
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));["t1","t2","t3"].forEach(id=>$(id).hidden=id!==t.dataset.t)});

/* m=1 ficha */
if($("mk"))$("mk").onclick=()=>{
  if(!(S.nombre||"").trim()||!S.rol||(S.r1||"").trim().length<20||!(S.cual||[]).length){$("w").textContent="Completa tu nombre, el rol, al menos una cualidad y tu respuesta (mín. 20 caracteres).";return}
  $("w").textContent="";
  $("card").innerHTML=`<div class="fcard"><div class="num">${esc((S.dorsal||"").slice(0,2))||"★"}</div><div><span class="role">${esc(S.rol)}</span><h2>${esc(S.nombre)}</h2><div class="tags">${S.cual.map(c=>`<span>${esc(c)}</span>`).join("")}</div><p>“${esc(S.r1)}”</p></div></div>`;
};
/* m=7 ficha sesión */
const fichaTxt=()=>`FICHA DE SESIÓN CON VALORES\nGrupo: ${S.grupo||"—"}\nObjetivo: ${S.obj||"—"}\nValor olímpico: ${S.val||"—"} · Habilidad blanda: ${S.hab||"—"}\n\n1. FASE INICIAL\n${S.fase1||"—"}\n\n2. FASE CENTRAL\n${S.fase2||"—"}\n\n3. FASE FINAL Y REFLEXIÓN\n${S.fase3||"—"}`;
if($("ficha"))$("ficha").onclick=()=>{$("fout").textContent=fichaTxt();$("fout").hidden=false};
if($("ev"))$("ev").onchange=e=>{const f=[...e.target.files];$("evl").textContent=f.length?"Archivos listos para entregar en el aula virtual: "+f.map(x=>x.name).join(", "):"Ningún archivo seleccionado."};
/* m=8 estrellas */
if($("crit")){S.st=S.st||[3,3,3,3,3];
  const drawSt=()=>{$("crit").innerHTML=CRIT.map((c,i)=>`<div class="crit"><span>${c}</span><div class="stars" role="radiogroup" aria-label="${c}">${[1,2,3,4,5].map(n=>`<button class="star ${n<=S.st[i]?"on":""}" data-i="${i}" data-n="${n}" aria-label="${n} estrellas">★</button>`).join("")}</div></div>`).join("");
    $("tot").textContent=S.st.reduce((a,b)=>a+b,0);
    document.querySelectorAll(".star").forEach(s=>s.onclick=()=>{S.st[+s.dataset.i]=+s.dataset.n;save();drawSt()})};
  drawSt();
  $("close").onclick=()=>{if((S.fin||"").trim().length<30){$("badge").innerHTML=`<p class="sub" style="color:var(--pink)">Escribe tu compromiso (mínimo 30 caracteres) para terminar la ruta.</p>`;return}
    const t=S.st.reduce((a,b)=>a+b,0);
    $("badge").innerHTML=`<div class="badge"><svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 4h40l-12 34H42z" fill="#e23e7a"/><circle cx="50" cy="64" r="32" fill="#f28c28" stroke="#fff" stroke-width="4"/><path d="M50 46l5.3 10.8 11.9 1.7-8.6 8.4 2 11.9L50 73.2l-10.6 5.6 2-11.9-8.6-8.4 11.9-1.7z" fill="#fff"/></svg><h2>¡Ruta completada!</h2><p style="margin:0">Autoevaluación: <b>${t}/25 ★</b></p><p class="q">“${esc(S.fin)}”</p><p class="sub" style="color:#d9c8ea">Excelencia · Respeto · Amistad</p></div>`};
}
/* copiar */
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.copy; let txt;
  if(k==="ses")txt=fichaTxt();
  else{const parts=[...document.querySelectorAll("textarea")].map(t=>document.querySelector(`label[for="${t.id}"]`).textContent+"\n"+(t.value||"—"));
    if(m==="8")parts.unshift("Autoevaluación: "+S.st.reduce((a,c)=>a+c,0)+"/25 estrellas");
    if(m==="7")parts.unshift(fichaTxt());txt=parts.join("\n\n")}
  const msg=$("cm_"+k);
  const fb=()=>{let o=$("o_"+k);if(!o){o=document.createElement("div");o.id="o_"+k;o.className="out";b.parentElement.after(o)}o.textContent=txt;const r=document.createRange();r.selectNodeContents(o);const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="Texto seleccionado: presiona Ctrl+C"};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>msg.textContent="Copiado ✔ Pégalo en el foro").catch(fb);else fb();
});
</script>
</body></html>
