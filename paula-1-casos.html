<style>

  :root{--ink:#2b1240;--pink:#e23e7a;--orange:#f28c28;--lav:#f4eefa;--line:#e3d8ee;--muted:#6e5a80;

  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:"Creato Display","Segoe UI",Tahoma,Verdana,sans-serif;font-size:15px;line-height:1.45}
  .wrap{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:920px;margin:auto}
  h1{font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:26px;font-weight:400;margin:0}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;border-radius:999px;padding:8px 14px;background:var(--lav);font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}
  .tab .ok{color:var(--good);font-size:12px}
  .tab[aria-selected="true"] .ok{color:#9be3bf}
  .tab:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .board{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .board .role{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
  .board b{font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:18px;display:block}
  .quarters{display:flex;gap:6px}
  .quarters span{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.12)}
  .quarters span.on{background:var(--pink)}
  .quarters span.done{background:rgba(255,255,255,.3)}
  .pts{font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .pts small{font-size:12px;font-weight:400;opacity:.75;display:block;text-align:right}
  .stage{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:11px;min-height:240px}
  .sit{background:var(--lav);border-radius:8px;padding:10px 12px}
  .q{font-family:"Matcha Style","Trebuchet MS",Verdana,sans-serif;font-size:18px;font-weight:700;margin:0}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;transition:.15s}
  .opt .k{width:24px;height:24px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-weight:700;font-size:12px}
  .opt:hover:not([disabled]){border-color:var(--pink);transform:translateY(-2px)}
  .opt[disabled]{cursor:default;opacity:.5}
  .good{background:var(--good-bg);border-color:var(--good)!important;opacity:1!important}
  .mid{background:var(--mid-bg);border-color:var(--mid)!important;opacity:1!important}
  .bad{background:var(--bad-bg);border-color:var(--bad)!important;opacity:1!important}
  .fb{border-radius:8px;padding:10px 13px;border-left:5px solid}
  .fb strong{display:block}
  .fb .skill{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;background:#fff;border-radius:999px;padding:2px 9px}
  .btn{all:unset;cursor:pointer;background:var(--pink);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;align-self:flex-start}
  .btn.alt{background:var(--ink)}
  .final{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .ball{width:84px;height:84px;flex:none}
  .stars{font-size:22px;color:var(--orange);letter-spacing:2px}
  .summary{font-size:13.5px;color:var(--muted)}
  @media (max-width:640px){.opts{grid-template-columns:1fr}.wrap{padding:12px}}

  .mrow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
  .mascot{width:96px;height:118px;display:flex;align-items:flex-end;justify-content:center}
  .mascot svg{width:100%;height:100%;animation:hop 1.8s ease-in-out infinite;transform-origin:50% 100%}
  .mascot.bump svg{animation:bump .6s ease-out,hop 1.8s ease-in-out .6s infinite}
  .wave{transform-box:fill-box;transform-origin:0% 100%;animation:wv .8s ease-in-out infinite alternate}
  .speech{position:relative;background:#fff;border:2.5px solid #2b1240;border-radius:16px;padding:10px 14px;font-weight:700;min-height:44px;display:flex;align-items:center}
  .speech:before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#2b1240;border-left:0}
  .speech b.nm{color:#e23e7a;margin-right:6px}
  .cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall linear forwards}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
  @keyframes wv{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){.mascot svg,.wave,.cf{animation:none!important}}
  @media (max-width:600px){.mrow{grid-template-columns:72px 1fr}.mascot{width:72px;height:90px}}

   ["No intervengo mientras siga ganando.","bad",0,"Avalas el maltrato y vulneras la integridad de las deportistas.","—"],
   ["La despido de inmediato sin escucharla.","mid",1,"Proteges a las jugadoras, pero sin debido proceso ni oportunidad de cambio.","Resolución de problemas"]]},
  {p:"Momento 3 · ¿Qué propuesta final llevas a la junta?",o:[
   ["Un plan mixto: mantener categorías infantiles con patrocinio local y metas medibles para el equipo mayor.","good",3,"Equilibras excelencia deportiva y formación: solución creativa y sostenible.","Resolución de problemas"],
   ["Pedir más dinero a las familias para no tocar nada.","mid",1,"Puede funcionar, pero traslada el problema y excluye a quien no puede pagar.","—"],
   ["Renunciar al cargo.","bad",0,"Abandonas a las deportistas justo cuando más necesitan liderazgo.","—"]]}]}
];
const R={}; let ci=0, step=0, pts=0, picks=[];
const $=id=>document.getElementById(id);
try{Object.assign(R,JSON.parse(localStorage.getItem("paula-casos")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("paula-casos",JSON.stringify(R))}catch(e){}};
const BALL=`<svg class="ball" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 4h40l-12 34H42z" fill="#e23e7a"/><circle cx="50" cy="64" r="32" fill="#f28c28" stroke="#2b1240" stroke-width="4"/><path d="M50 46l5.3 10.8 11.9 1.7-8.6 8.4 2 11.9L50 73.2l-10.6 5.6 2-11.9-8.6-8.4 11.9-1.7z" fill="#fff"/></svg>`;

function tabs(){
  $("tabs").innerHTML=CASOS.map((c,i)=>`<button class="tab" role="tab" aria-selected="${i===ci}" data-i="${i}">${c.rol}${R[i]!=null?`<span class="ok">✔ ${R[i]}/9</span>`:""}</button>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ci=+t.dataset.i;step=0;pts=0;picks=[];tabs();draw()});
  const n=Object.keys(R).length;
  $("summary").textContent=n?`Casos resueltos: ${n} de 3 · Puntos totales: ${Object.values(R).reduce((a,b)=>a+b,0)} de ${n*9}`:"";
}
function board(){
  const c=CASOS[ci];
  $("board").innerHTML=`<div><span class="role">${c.rol} · ${c.tipo}</span><b>${step<3?"Momento "+(step+1)+" de 3":"Resultado final"}</b></div>
   <div class="quarters">${[0,1,2].map(i=>`<span class="${i===step?"on":i<step?"done":""}">M${i+1}</span>`).join("")}</div>
   <div class="pts">${pts}<small>puntos</small></div>`;
}
function draw(){
  const c=CASOS[ci], st=$("stage"); board();
  if(step>=3){
    R[ci]=pts; save(); tabs();FUN.say(pts>=8?"good":pts>=5?"mid":"bad",pts>=8?"¡Actuación de campeona!":pts>=5?"Vas muy bien, ajusta los detalles.":"¡Otra vez! Yo te acompaño.");if(pts>=8)FUN.confetti();
    const nivel=pts>=8?["Actuación profesional sólida","★★★"]:pts>=5?["Buen criterio, con ajustes por hacer","★★☆"]:["Vale la pena repetir este caso","★☆☆"];
    st.innerHTML=`<div class="final">${BALL}<div><div class="stars">${nivel[1]}</div><b style="font-size:18px">${nivel[0]}</b><p class="sub">Obtuviste ${pts} de 9 puntos.</p></div></div>
     <p class="sub"><b>Habilidades que pusiste en juego:</b> ${[...new Set(picks.filter(s=>s!=="—"))].join(", ")||"ninguna todavía"}.</p>
     <button class="btn alt" id="again">Repetir este caso</button>`;
    $("again").onclick=()=>{step=0;pts=0;picks=[];draw()}; return;
  }
  const s=c.q[step];
  st.innerHTML=`${step===0?`<div class="sit"><b>Situación:</b> ${c.ctx}</div>`:""}<p class="q">${s.p}</p>
    <div class="opts">${s.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABC"[j]}</span><span>${o[0]}</span></button>`).join("")}</div><div id="fb"></div>`;
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=s.o[+b.dataset.j]; pts+=o[2]; picks.push(o[4]); board();
    st.querySelectorAll(".opt").forEach(x=>x.setAttribute("disabled",""));
    b.classList.add(o[1]);FUN.say(o[1],FUN.pick({good:GOOD,mid:MID,bad:BAD}[o[1]]));if(o[1]==="good")FUN.confetti(40);
    const lab={good:"Buena decisión",mid:"Decisión a medias",bad:"Decisión a revisar"}[o[1]];
    $("fb").innerHTML=`<div class="fb ${o[1]}"><strong>${lab} · +${o[2]} pts</strong>${o[3]}${o[4]!=="—"?`<br><span class="skill">Habilidad: ${o[4]}</span>`:""}</div>
      <button class="btn" id="next" style="margin-top:10px">${step<2?"Siguiente momento →":"Ver resultado final"}</button>`;
    $("next").onclick=()=>{step++;draw()};
  });
}
tabs(); draw();
</script>
</body></html>
